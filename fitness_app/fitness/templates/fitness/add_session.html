<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Training Session // FitnessHUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #161920;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --border: #2d3748;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .container {
            width: 100%;
            max-width: 550px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            color: var(--text-main);
        }

        form {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* Django form paragraph styling */
        p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input[type="text"],
        input[type="datetime-local"],
        select {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Fix for calendar icon appearance in dark mode */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button[type="submit"] {
            flex: 1;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: #2563eb;
        }

        .cancel-btn {
            flex: 1;
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            text-decoration: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            display: inline-block;
            text-align: center;
            transition: all 0.2s;
        }

        .cancel-box-wrapper {
            flex: 1;
            display: flex;
        }

        .cancel-btn:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.03);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Book a Training Session</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="btn-group">
                <button type="submit">Confirm Booking</button>
                <div class="cancel-box-wrapper">
                    <a href="{% url 'index' %}" class="cancel-btn">Cancel</a>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
