<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Client // FitnessHUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #161920;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
            --border: #2d3748;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .container { width: 100%; max-width: 500px; }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        form { background-color: var(--card-bg); border: 1px solid var(--border); padding: 24px; border-radius: 12px; }
        p { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 10px 12px; background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 14px; box-sizing: border-box; }
        input:focus { outline: none; border-color: var(--accent); }
        .btn-group { display: flex; gap: 10px; margin-top: 24px; }
        button { flex: 1; background-color: var(--accent); color: white; border: none; padding: 10px; font-weight: 600; border-radius: 6px; cursor: pointer; }
        .cancel-btn { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register New Client</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="btn-group">
                <button type="submit">Save Client</button>
                <a href="{% url 'index' %}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
