<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancel Session // FitnessHUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f1115; --card-bg: #161920; --text-main: #ffffff; --text-muted: #9ca3af; --accent: #3b82f6; --border: #2d3748; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .container { width: 100%; max-width: 450px; text-align: center; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 12px; }
        h2 { font-size: 18px; margin-bottom: 10px; color: #ef4444; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; background-color: #ef4444; color: white; border: none; padding: 10px; font-weight: 600; border-radius: 6px; cursor: pointer; }
        button:hover { background-color: #dc2626; }
        .cancel-btn { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Cancel Training Session?</h2>
            <p>Are you sure you want to cancel the session between <strong>{{ session.client }}</strong> and <strong>{{ session.trainer }}</strong> on {{ session.session_date }}?</p>

            <form method="POST">
                {% csrf_token %}
                <div class="btn-group">
                    <button type="submit">Yes, Cancel</button>
                    <a href="{% url 'index' %}" class="cancel-btn">Go Back</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
